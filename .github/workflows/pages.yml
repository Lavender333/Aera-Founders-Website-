name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare static site
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          cp -R story faq process dist/

      - name: Verify production entrypoint
        run: |
          if grep -q '/src/main.tsx' dist/index.html; then
            echo "Production HTML still points to the TypeScript source entrypoint." >&2
            exit 1
          fi
          grep -q 'AERA — Founders, Readiness, and Coordination' dist/index.html

      - name: Add CNAME
        run: echo "aerafounders.com" > dist/CNAME

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
